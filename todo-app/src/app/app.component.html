<div class="container">
  <h2>My TODO List</h2>
  <input [(ngModel)]="newTodo" placeholder="Add new task" />
  <button (click)="addTodo()">Add</button>

  <ul>
    <li *ngFor="let todo of todos">
      {{ todo.title }}
      <button (click)="deleteTodo(todo.id)">Delete</button>
    </li>
  </ul>
</div>
